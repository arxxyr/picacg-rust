# GitLab CI/CD 配置
# PicACG Rust 客户端 - 持续集成

stages:
  - check
  - test
  - build

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUSTFLAGS: "-D warnings"
  # 使用 nightly（edition 2024 需要）
  RUST_TOOLCHAIN: nightly

# 缓存 cargo 依赖和构建产物
.rust-cache: &rust-cache
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
    policy: pull-push

# 基础镜像配置（含 Bevy 系统依赖）
.rust-base: &rust-base
  image: rust:latest
  before_script:
    - rustup default ${RUST_TOOLCHAIN}
    - rustup component add rustfmt clippy
    - apt-get update && apt-get install -y
        libasound2-dev
        libudev-dev
        libwayland-dev
        libxkbcommon-dev
        libvulkan-dev
    - rustc --version && cargo --version

# ============ Check 阶段 ============

# 代码格式检查
fmt:
  <<: *rust-base
  <<: *rust-cache
  stage: check
  script:
    - cargo fmt --all -- --check
  allow_failure: false

# Clippy 静态分析
clippy:
  <<: *rust-base
  <<: *rust-cache
  stage: check
  script:
    - cargo clippy --all --all-targets -- -D warnings
    - python3 scripts/check_query_conflicts.py
  allow_failure: false

# ============ Test 阶段 ============

# 单元测试
test:
  <<: *rust-base
  <<: *rust-cache
  stage: test
  script:
    - cargo test --all --release
  needs:
    - fmt
    - clippy

# ============ Build 阶段 ============

# Release 构建
build-release:
  <<: *rust-base
  <<: *rust-cache
  stage: build
  script:
    - cargo build --release -p picacg
    # 收集产物（可执行文件 + 内置字体）
    - mkdir -p package/assets/fonts/SarasaTermSCNerd
    - cp target/release/picacg package/
    - |
      FONT_SRC="assets/fonts/SarasaTermSCNerd/SarasaTermSCNerd-Regular.ttf"
      if [ -f "$FONT_SRC" ]; then
        cp "$FONT_SRC" package/assets/fonts/SarasaTermSCNerd/
        echo "已打包内置字体"
      fi
  artifacts:
    name: "picacg-${CI_COMMIT_SHORT_SHA}"
    paths:
      - package/
    expire_in: 7 days
  needs:
    - test
  only:
    - main
    - master
    - tags
    - merge_requests

# Debug 构建（用于 MR 快速验证）
build-debug:
  <<: *rust-base
  <<: *rust-cache
  stage: build
  script:
    - cargo build -p picacg
  needs:
    - fmt
    - clippy
  except:
    - main
    - master
    - tags
