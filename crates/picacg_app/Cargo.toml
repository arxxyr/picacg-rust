[package]
name = "picacg"
version.workspace = true
edition.workspace = true
authors = ["PicACG Contributors"]
license.workspace = true
description = "PicACG 漫画客户端 - Rust Bevy 版"

[[bin]]
name = "picacg"
path = "src/main.rs"

[features]

# 系统耗时追踪：打开 bevy_ecs 的 trace，让每个系统的每次执行都带上
# `info_span!("system", name = ...)`，由 utils::profiling 的 Layer 聚合。
#
# 这些 span 在 bevy_ecs 里是 `#[cfg(feature = "trace")]` 门控的，不编进来
# 就压根不存在，光靠运行时开关拿不到数据——所以**默认开启**，让设置页的
# 开关有东西可管。真正的开销由「装不装聚合 Layer」决定：不装时没有订阅者对
# 这个 callsite 感兴趣，tracing 把它缓存成禁用态，`.enter()` 退化成一次分支。
#
# ⚠️ **不设为默认 feature**：`bevy/trace` 直接插桩 bevy_render 等巨型 crate，
# release 编译的峰值内存会把 16GB 的 GitHub runner 吃穿——实测可用内存 80 秒内
# 从 12.8GB 直坠到 37MB，runner 整个被杀。对照组：2026-08-12 的 v0.4.0 在同档
# runner、同样 `cargo test --all --release` 下 13 分钟通过，差别只有本 feature。
#
# 想用耗时榜：`cargo run --release --features profiling`
#（F3 帧时叠加层、设置页开关与榜单落盘在任何构建里都可用，不需要本 feature）
profiling = ["bevy/trace"]

[dependencies]
# === 本地 crate ===
picacg_core = { path = "../picacg_core" }
picacg_api = { path = "../picacg_api" }
picacg_db = { path = "../picacg_db" }
picacg_config = { path = "../picacg_config" }

# === Bevy 核心 ===
bevy.workspace = true
# bevy-tokio-tasks 已内嵌在 utils/tokio_tasks.rs

# === 异步运行时 ===
tokio.workspace = true

# === 网络与序列化 ===
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# === 错误处理 ===
thiserror.workspace = true

# === 日志 ===
tracing.workspace = true
tracing-subscriber.workspace = true

# === 加密 ===
hmac.workspace = true
sha2.workspace = true
hex.workspace = true

# === 工具库 ===
uuid.workspace = true
chrono.workspace = true
urlencoding.workspace = true
parking_lot.workspace = true
directories.workspace = true
arboard.workspace = true

# === 数据库 ===
sqlx.workspace = true

# === 缓存 ===

# === 图片处理 ===
image.workspace = true
open.workspace = true

# === 文件对话框 ===
rfd.workspace = true

# === 压缩 ===
zip.workspace = true

# === 繁简转换 ===
zhconv.workspace = true

# === WebSocket ===
tokio-tungstenite.workspace = true
futures-util.workspace = true

# === 内存分配器 ===
mimalloc.workspace = true

# === 窗口图标（bevy 未暴露 winit::window::Icon，需直接依赖 winit）===
winit.workspace = true

# === 自动更新 ===
# tar/flate2 全平台引入：解包逻辑抽成了平台无关的纯函数并配了单测，
# 否则那段只有 Linux 构建会编译，写错了要等 CI 才知道
tar.workspace = true
flate2.workspace = true

# 自替换只有 Linux 用得上
[target.'cfg(target_os = "linux")'.dependencies]
self-replace.workspace = true

# === macOS dock 图标（AppKit）===
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

