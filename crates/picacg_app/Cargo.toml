[package]
name = "picacg"
version.workspace = true
edition.workspace = true
authors = ["PicACG Contributors"]
license.workspace = true
description = "PicACG 漫画客户端 - Rust Bevy 版"

[[bin]]
name = "picacg"
path = "src/main.rs"

[features]

# 系统耗时追踪：打开 bevy_ecs 的 trace，让每个系统的每次执行都带上
# `info_span!("system", name = ...)`，由 utils::profiling 的 Layer 聚合。
# 这些 span 在 bevy_ecs 里是 `#[cfg(feature = "trace")]` 门控的，不编进来
# 就压根不存在，光靠运行时开关拿不到数据。
#
# ⚠️ **不能设成默认 feature**：`bevy/trace` 会直接插桩 bevy_render 等巨型 crate，
# 编译峰值内存随之上涨。GitHub 的 ubuntu runner 实测只有 7.8GB 内存 + 3GB swap，
# 开了之后单个 rustc 编译 bevy_render 就会陷入交换抖动——实测卡死 35 分钟零输出、
# runner 被整个杀掉，且把 CARGO_BUILD_JOBS 降到 1 也无济于事（不是并行度问题，
# 是单 crate 峰值就超了）。
#
# 想用耗时榜：`cargo run --release --features profiling`
# （F3 帧时叠加层与设置页其余部分在任何构建里都可用，不需要本 feature）
profiling = ["bevy/trace"]

[dependencies]
# === 本地 crate ===
picacg_core = { path = "../picacg_core" }
picacg_api = { path = "../picacg_api" }
picacg_db = { path = "../picacg_db" }
picacg_config = { path = "../picacg_config" }

# === Bevy 核心 ===
bevy.workspace = true
# bevy-tokio-tasks 已内嵌在 utils/tokio_tasks.rs

# === 异步运行时 ===
tokio.workspace = true

# === 网络与序列化 ===
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# === 错误处理 ===
thiserror.workspace = true

# === 日志 ===
tracing.workspace = true
tracing-subscriber.workspace = true

# === 加密 ===
hmac.workspace = true
sha2.workspace = true
hex.workspace = true

# === 工具库 ===
uuid.workspace = true
chrono.workspace = true
urlencoding.workspace = true
parking_lot.workspace = true
directories.workspace = true
arboard.workspace = true

# === 数据库 ===
sqlx.workspace = true

# === 缓存 ===
moka.workspace = true

# === 图片处理 ===
image.workspace = true
open.workspace = true

# === 文件对话框 ===
rfd.workspace = true

# === 压缩 ===
zip.workspace = true

# === 繁简转换 ===
zhconv.workspace = true

# === WebSocket ===
tokio-tungstenite.workspace = true
futures-util.workspace = true

# === 内存分配器 ===
mimalloc.workspace = true

# === 窗口图标（bevy 未暴露 winit::window::Icon，需直接依赖 winit）===
winit.workspace = true

# === macOS dock 图标（AppKit）===
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

