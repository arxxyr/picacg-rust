[package]
name = "bevy_ui_toolkit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Bevy UI 工具库 - 提供滚动条、分页、瀑布流等通用 UI 组件"
repository = "https://git.yang.cafe:30080/loosqk/bevy_ui_toolkit"
keywords = ["bevy", "ui", "scrollbar", "pagination", "waterfall"]
categories = ["gui", "game-development"]
readme = "README.md"

[dependencies]
bevy = { version = "0.18.0", default-features = false, features = [
    "bevy_ui",
    "bevy_color",
    "bevy_text",
    "bevy_window",
    "bevy_render",
    "bevy_asset",
] }

[dev-dependencies]
bevy = "0.18.0"

[features]
default = []
full = []
