[workspace]
members = [
    "crates/bevy_ui_toolkit",
    "crates/picacg_core",
    "crates/picacg_api",
    "crates/picacg_db",
    "crates/picacg_config",
    "crates/picacg_app",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]
# === Bevy 核心 ===
bevy = { version = "0.17", default-features = true }
bevy-tokio-tasks = "0.17"

# === 异步运行时 ===
tokio = { version = "1.36", features = ["full"] }
tokio-util = "0.7"
tokio-test = "0.4"
futures = "0.3"
async-trait = "0.1"

# === 网络与序列化 ===
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# === 错误处理 ===
anyhow = "1.0"
thiserror = "2.0"

# === 日志 ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === 加密 ===
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# === 工具库 ===
uuid = { version = "1.19.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
parking_lot = "0.12"
once_cell = "1.19"
directories = "6.0"
arboard = "3.6.1"

# === 数据库 ===
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }

# === 缓存 ===
moka = { version = "0.12", features = ["future"] }

# === 图片处理 ===
image = "0.25"
open = "5.3.3"

# === 文件对话框 ===
rfd = "0.16.0"

# === 编译配置 ===
[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
