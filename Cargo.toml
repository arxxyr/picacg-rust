[package]
name = "picacg"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["PicACG Contributors"]
license = "GPL-3.0"
description = "PicACG 漫画客户端 - Rust Bevy 版"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

[dependencies]
# === Bevy 核心 ===
bevy = { version = "0.17", default-features = true }

# === 异步运行时集成 ===
bevy-tokio-tasks = "0.17"
tokio = { version = "1.36", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# === UI 扩展 ===
# bevy_ui_text_input = "0.9"  # 暂时注释，等确认兼容性

# === 网络与序列化（保留） ===
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# === 错误处理（保留） ===
anyhow = "1.0"
thiserror = "2.0"

# === 日志（保留） ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === 加密（保留） ===
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# === 工具库（保留） ===
uuid = { version = "1.19.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
parking_lot = "0.12"
once_cell = "1.19"
directories = "6.0"
arboard = "3.6.1"  # 剪贴板支持

# === 数据库（保留） ===
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }

# === 缓存（保留） ===
moka = { version = "0.12", features = ["future"] }

# === 图片处理 ===
image = "0.25"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "picacg"
path = "src/main.rs"
