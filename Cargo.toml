[package]
name = "picacg"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["PicACG Contributors"]
license = "GPL-3.0"
description = "PicACG 漫画客户端 - Rust 重写版"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

[dependencies]
tokio = { version = "1.36", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12.24", features = ["json", "cookies", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
anyhow = "1.0"
thiserror = "2.0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.7", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
parking_lot = "0.12"
once_cell = "1.19"
directories = "6.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
moka = { version = "0.12", features = ["future"] }
iced = { version = "0.13", features = ["tokio", "image", "canvas"] }
image = "0.25"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "picacg"
path = "src/main.rs"
