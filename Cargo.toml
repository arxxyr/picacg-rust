[workspace]
members = [
    "crates/picacg_core",
    "crates/picacg_api",
    "crates/picacg_db",
    "crates/picacg_config",
    "crates/picacg_app",
    "crates/bevy_ui_toolkit",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# === Bevy 核心 ===
bevy = { version = "0.18.1", default-features = true, features = ["bevy_debug_stepping"] }
# bevy-tokio-tasks 已内嵌在 picacg_app/src/utils/tokio_tasks.rs
bevy_ui_toolkit = { path = "crates/bevy_ui_toolkit" }

# === 异步运行时 ===
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tokio-test = "0.4.5"
futures = "0.3.32"
async-trait = "0.1"

# === 网络与序列化 ===
reqwest = { version = "0.13.2", features = ["json", "cookies", "stream", "rustls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9"

# === 错误处理 ===
anyhow = "1.0.102"
thiserror = "2.0.18"

# === 日志 ===
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# === 加密 ===
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# === 工具库 ===
uuid = { version = "1.21.0", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
urlencoding = "2.1"
parking_lot = "0.12"
once_cell = "1.21.4"
directories = "6.0"
arboard = "3.6.1"

# === 数据库 ===
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }

# === 缓存 ===
moka = { version = "0.12.15", features = ["future"] }

# === 图片处理 ===
image = "0.25.10"
open = "5.3.3"

# === 文件对话框 ===
rfd = "0.17.2"

# === 压缩 ===
zip = { version = "8.3.1", default-features = false }

# === 繁简转换 ===
zhconv = "0.4.1"

# === 内存分配器 ===
mimalloc = { version = "0.1", default-features = false }

# === 编译配置 ===
[profile.dev]
opt-level = 0
debug = true

[profile.ci-dev]
inherits = "dev"
incremental = false

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
