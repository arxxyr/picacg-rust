[workspace]
members = [
    "crates/picacg_core",
    "crates/picacg_api",
    "crates/picacg_db",
    "crates/picacg_config",
    "crates/picacg_app",
]
resolver = "2"

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# === Bevy 核心 ===
# 纯 UI 应用按需 feature：ui 集合（含 scene/picking/widgets/窗口/文本/png）+ 多线程调度 + 默认字体兜底
# 3D/音频栈零使用不再编译（原 default = 2d+3d+ui+audio）
bevy = { version = "0.19.1", default-features = false, features = [
    "ui",
    "multi_threaded",
    "default_font",
    "bevy_debug_stepping",
] }
# bevy-tokio-tasks 已内嵌在 picacg_app/src/utils/tokio_tasks.rs

# === 异步运行时 ===
tokio = { version = "1.53.1", features = ["full"] }

# === 网络与序列化 ===
# blocking：自动更新在 spawn_blocking 里同步下载校验（见 utils/self_update.rs）
reqwest = { version = "0.13.4", features = ["json", "cookies", "stream", "rustls", "socks", "gzip", "brotli", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

# === 错误处理 ===
thiserror = "2.0.20"

# === 日志 ===
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }

# === 加密 ===
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"

# === 工具库 ===
uuid = { version = "1.26.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
urlencoding = "2.1.3"
parking_lot = "0.12.5"
directories = "6.0.0"
arboard = "3.6.1"

# === 数据库 ===
# sqlx 0.9 起 runtime-tokio-rustls 拆分为 runtime-tokio + tls-*；SQLite 无需 TLS
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }

# === 缓存 ===
moka = { version = "0.12.16", features = ["future"] }

# === 图片处理 ===
image = "0.25.10"
open = "5.4.2"

# === 文件对话框 ===
rfd = "0.17.2"

# === 自动更新 ===
# Linux 走原地自替换（self-replace 处理"替换正在运行的可执行文件"），
# 需要自己解 tar.gz；macOS / Windows 只下载后交给系统打开，不需要这些。
# 没用 self_update crate：它把下载/解包/替换打成黑盒，而我们要三平台各走各的路，
# 且校验和策略要自己掌控。
self-replace = "1.5"
tar = "0.4"
flate2 = "1.1"

# === 窗口 / Dock 图标 ===
# 版本与 bevy_winit 0.19 依赖的 winit 对齐，避免多编一份
winit = { version = "0.30", default-features = false }
# macOS dock 图标走 AppKit；这几个 crate 已在 winit/rfd/arboard 的依赖树中，
# 所用 feature 也已被它们打开，直接依赖不增加编译量
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
] }

# === 压缩 ===
zip = { version = "8.6.0", default-features = false }

# === 繁简转换 ===
zhconv = "0.4.1"

# === WebSocket ===
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"

# === 内存分配器 ===
mimalloc = { version = "0.1.52", default-features = false }

# === 编译配置 ===
[profile.dev]
opt-level = 0
debug = true

# 依赖只保留行号表调试信息：显著缩小 __eh_frame（消除 macOS 链接器警告）并加快链接
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.ci-dev]
inherits = "dev"
incremental = false

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
