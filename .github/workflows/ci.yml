# GitHub Actions CI/CD 配置
# PicACG Rust 客户端 - 持续集成
# 版本格式: v主版本.次版本.修订号+日期.commit短哈希

name: CI

on:
  push:
    # dev 是本项目的日常开发分支（原先只列了 develop，实际分支叫 dev，
    # 导致所有开发分支推送都不跑 CI）
    branches: [main, master, develop, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0        # release 构建关闭增量，配合 LTO 优化
  CARGO_NET_RETRY: 10         # 网络重试次数
  RUST_BACKTRACE: short

jobs:
  # ============ 代码检查 ============
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      # Bevy 在 Linux 上需要的系统依赖
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Query 冲突扫描（B0001 静态检查）
        run: python3 scripts/check_query_conflicts.py

  # ============ 测试 ============
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [clippy]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 诊断步骤，长期保留：runner 被杀时日志里只有一句
      # "received a shutdown signal"，没有任何现场。曾因缺这几行连挂 7 次 CI、
      # 先后错怪 release 编译/并行度/bevy_trace/Cargo.lock——先看数据，别猜
      - name: Show runner resources
        run: |
          echo "== 内存 =="; free -h
          echo "== 磁盘 =="; df -h /
          echo "== CPU =="; nproc

      # ⚠️ 不加 --release，原因不是省时间，是**内存**：
      # 根 Cargo.toml 的 release profile 是 `lto = "fat"` + `codegen-units = 1`，
      # 后者强制把整个 crate 的代码生成塞进单个单元，峰值内存 = 整个 crate 一次性
      # 展开——bevy_core_pipeline / bevy_render 这类巨型 crate 单个 rustc 就要 ~7GB。
      # 实测即便 CARGO_BUILD_JOBS=2，两个进程也能把 16GB 的 runner 吃穿
      # （可用内存 80 秒内从 14GB 掉到 28MB，runner 整个被杀）。
      #
      # 而单测全是纯函数（内容过滤 / 复用规划 / 条漫锚点换算），release 对它们
      # 零额外覆盖；debug profile 是 opt-level=0、无 LTO、codegen-units 默认 256，
      # 内存占用低一个量级。release 的编译覆盖由下面的 build job（三平台）承担。
      # 附带好处：debug 默认开溢出检查，对算术逻辑比 release 更严
      - name: Run tests
        run: |
          # 后台每 20 秒记一次余量，死前最后一条即为现场
          ( while true; do
              echo "[res] $(date -u +%H:%M:%S) 可用内存=$(free -m | awk 'NR==2{print $7}')MB 可用磁盘=$(df -m / | awk 'NR==2{print $4}')MB"
              sleep 20
            done ) &
          MONITOR_PID=$!
          trap 'kill $MONITOR_PID 2>/dev/null || true' EXIT
          cargo test --all

  # ============ 构建 ============
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64（Ubuntu 22.04 LTS，glibc 2.35，兼容性好）
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            exe_suffix: ""
            archive_ext: "tar.gz"
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            exe_suffix: ".exe"
            archive_ext: "zip"
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            exe_suffix: ""
            archive_ext: "dmg"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      # Bevy 在 Linux 上需要的系统依赖
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 生成版本信息
      - name: Generate version info
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*= *"\([^"]*\)".*/\1/')
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # 命名分 Release / Dev 两档（见 CLAUDE.md §9）。判据不能只看
          # `refs/tags/v*`：master 推送走的是 auto-release，tag 是在**产物构建完
          # 之后**才创建的，build job 永远看不到它——v0.5.0 就因此被打成了
          # Dev 格式（picacg-v0.5.0+20260830.c43f411-…）发了出去。
          # 故 master/main 上复用 auto-release 的同一判据：该版本 tag 尚不存在
          # = 本次推送会被发布 → 按 Release 命名。
          IS_RELEASE=false
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_RELEASE=true
          elif [[ "${{ github.ref }}" == refs/heads/master || "${{ github.ref }}" == refs/heads/main ]]; then
            # ls-remote 失败会因 `set -e` 直接中止本步骤，不会静默误判
            EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/v${BASE_VERSION}")
            if [ -z "$EXISTING_TAG" ]; then
              IS_RELEASE=true
            fi
          fi

          if [ "$IS_RELEASE" = true ]; then
            BUILD_META="${SHORT_SHA}"
            BUILD_TYPE="release"
          else
            BUILD_DATE=$(date -u +%Y%m%d)
            BUILD_META="${BUILD_DATE}.${SHORT_SHA}"
            BUILD_TYPE="dev"
          fi
          echo "build_meta=$BUILD_META" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

          FULL_VERSION="v${BASE_VERSION}+${BUILD_META}"
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

          PACKAGE_NAME="picacg-${FULL_VERSION}-${{ matrix.platform }}"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

          echo "=== Version Info ==="
          echo "Build Type: $BUILD_TYPE"
          echo "Full Version: $FULL_VERSION"

      - name: Build release
        env:
          # release profile 是 lto="fat" + codegen-units=1，后者强制整个 crate
          # 的代码生成塞进单个单元，bevy_core_pipeline / bevy_render 这类巨型
          # crate 单个 rustc 峰值约 7GB。16GB 的 runner 上 2 路（≈14GB）实测
          # 仍会被杀，只能串行。
          # 产物需要 lto=fat 的小体积二进制，所以不动 profile，用时间换内存
          CARGO_BUILD_JOBS: 1
        run: cargo build --release -p picacg --target ${{ matrix.target }}

      - name: Verify build artifacts
        shell: bash
        run: |
          echo "=== Executable ==="
          ls -lh "target/${{ matrix.target }}/release/picacg${{ matrix.exe_suffix }}"

      # 验证 ELF 完整性（Linux）
      - name: Verify ELF integrity
        if: runner.os == 'Linux'
        run: |
          EXE="target/${{ matrix.target }}/release/picacg"
          echo "=== 检查动态段 ==="
          readelf -d "$EXE" | head -10
          if readelf -d "$EXE" 2>&1 | grep -q "NEEDED"; then
            echo "✓ ELF 结构完整"
          else
            echo "✗ ELF 结构异常！"
            exit 1
          fi

      # UPX 压缩：**仅 Linux**
      #
      # Windows 必须跳过：UPX 加壳的无签名 exe 会触发 Defender / SmartScreen
      # 的木马误报（Wacatac、Wacapew!ml 之类启发式判定），拿体积换可用性不划算，
      # 根治要 Authenticode 签名证书。macOS 则是 UPX 本身不支持。
      # （此前条件写的是 `runner.os != 'macOS'`，把 Windows 也压了）
      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Compress binary with UPX
        if: runner.os == 'Linux'
        shell: bash
        run: |
          EXE="target/${{ matrix.target }}/release/picacg${{ matrix.exe_suffix }}"
          echo "=== 压缩前 ==="
          ls -lh "$EXE"
          upx --best --lzma "$EXE" || true
          echo "=== 压缩后 ==="
          ls -lh "$EXE"

      # 打包产物 (Linux)
      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package

          cp target/${{ matrix.target }}/release/picacg package/
          echo "${{ steps.version.outputs.full_version }}" > package/VERSION

          # 复制内置字体
          FONT_SRC="assets/fonts/SarasaTermSCNerd/SarasaTermSCNerd-Regular.ttf"
          if [ -f "$FONT_SRC" ]; then
            mkdir -p package/assets/fonts/SarasaTermSCNerd
            cp "$FONT_SRC" package/assets/fonts/SarasaTermSCNerd/
            echo "已打包内置字体: $(ls -lh "$FONT_SRC" | awk '{print $5}')"
          else
            echo "警告: 未找到内置字体 $FONT_SRC"
          fi

          cd package
          tar -czvf ../${{ steps.version.outputs.package_name }}.tar.gz .
          cd ..

      # 打包产物 (macOS: .app Bundle + .dmg)
      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_NAME="PicACG.app"
          APP_DIR="package/${APP_NAME}"

          # 创建 .app 目录结构
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          # 复制可执行文件
          cp target/${{ matrix.target }}/release/picacg "${APP_DIR}/Contents/MacOS/picacg"

          # 复制内置字体到 Resources
          FONT_SRC="assets/fonts/SarasaTermSCNerd/SarasaTermSCNerd-Regular.ttf"
          if [ -f "$FONT_SRC" ]; then
            mkdir -p "${APP_DIR}/Contents/Resources/assets/fonts/SarasaTermSCNerd"
            cp "$FONT_SRC" "${APP_DIR}/Contents/Resources/assets/fonts/SarasaTermSCNerd/"
            echo "已打包内置字体: $(ls -lh "$FONT_SRC" | awk '{print $5}')"
          else
            echo "警告: 未找到内置字体 $FONT_SRC"
          fi

          # 写入版本文件
          echo "${{ steps.version.outputs.full_version }}" > "${APP_DIR}/Contents/Resources/VERSION"

          # 生成 Info.plist
          VERSION="${{ steps.version.outputs.base_version }}"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleName</key>' \
            '    <string>PicACG</string>' \
            '    <key>CFBundleDisplayName</key>' \
            '    <string>PicACG</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>com.picacg</string>' \
            '    <key>CFBundleVersion</key>' \
            "    <string>${VERSION}</string>" \
            '    <key>CFBundleShortVersionString</key>' \
            "    <string>${VERSION}</string>" \
            '    <key>CFBundleExecutable</key>' \
            '    <string>picacg</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>APPL</string>' \
            '    <key>NSHighResolutionCapable</key>' \
            '    <true/>' \
            '    <key>LSMinimumSystemVersion</key>' \
            '    <string>11.0</string>' \
            '</dict>' \
            '</plist>' > "${APP_DIR}/Contents/Info.plist"

          # 创建 DMG 临时目录
          DMG_STAGING="dmg_staging"
          mkdir -p "${DMG_STAGING}"
          cp -R "${APP_DIR}" "${DMG_STAGING}/"
          ln -s /Applications "${DMG_STAGING}/Applications"

          # 生成 DMG
          hdiutil create \
            -volname "PicACG ${{ steps.version.outputs.full_version }}" \
            -srcfolder "${DMG_STAGING}" \
            -ov \
            -format UDZO \
            "${{ steps.version.outputs.package_name }}.dmg"

          rm -rf "${DMG_STAGING}" package

      # 打包产物 (Windows)
      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

          Copy-Item target/${{ matrix.target }}/release/picacg.exe package/
          "${{ steps.version.outputs.full_version }}" | Out-File -FilePath package/VERSION -Encoding UTF8

          # 复制内置字体
          $FontSrc = "assets\fonts\SarasaTermSCNerd\SarasaTermSCNerd-Regular.ttf"
          if (Test-Path $FontSrc) {
            New-Item -ItemType Directory -Force -Path "package\assets\fonts\SarasaTermSCNerd" | Out-Null
            Copy-Item $FontSrc "package\assets\fonts\SarasaTermSCNerd\"
            $FontSize = [math]::Round((Get-Item $FontSrc).Length / 1MB, 1)
            Write-Host "已打包内置字体: ${FontSize}MB"
          } else {
            Write-Host "警告: 未找到内置字体 $FontSrc"
          }

          Compress-Archive -Path package/* -DestinationPath "${{ steps.version.outputs.package_name }}.zip"

      # 生成 SHA-256 校验和
      #
      # 两个用途：① 手动下载的人能自己核对完整性；
      # ② 自动更新据此校验下载回来的包（见 utils/self_update.rs），
      #    没有校验和就不能安全地替换自身
      - name: Generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          for f in ${{ steps.version.outputs.package_name }}.*; do
            case "$f" in
              *.sha256) continue ;;
            esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              # macOS 没有 sha256sum，用 shasum 并对齐成同样的两列格式
              shasum -a 256 "$f" > "$f.sha256"
            fi
            echo "校验和: $(cat "$f.sha256")"
          done

      # 上传产物（master/main 和 tag 都上传，供 release 使用）
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.package_name }}
          path: |
            ${{ steps.version.outputs.package_name }}.tar.gz
            ${{ steps.version.outputs.package_name }}.zip
            ${{ steps.version.outputs.package_name }}.dmg
            ${{ steps.version.outputs.package_name }}.*.sha256
          retention-days: 7

  # ============ 自动 Tag + Release（master 分支版本变化时触发） ============
  auto-release:
    name: Auto Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check version and tag
        id: check
        run: |
          # 从 Cargo.toml 读取当前版本
          VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*= *"\([^"]*\)".*/\1/')
          TAG_NAME="v${VERSION}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "full_version=${TAG_NAME}+${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

          # 检查该 tag 是否已存在于远程
          if git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "Tag $TAG_NAME 已存在，跳过发布"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG_NAME 不存在，将创建并发布"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.check.outputs.tag_name }}" -m "Release ${{ steps.check.outputs.tag_name }}"
          git push origin "${{ steps.check.outputs.tag_name }}"

      - name: Download all artifacts
        if: steps.check.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        if: steps.check.outputs.should_release == 'true'
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.sha256" \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -la release/

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.check.outputs.full_version }}"
          tag_name: ${{ steps.check.outputs.tag_name }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.check.outputs.tag_name, 'beta') || contains(steps.check.outputs.tag_name, 'alpha') || contains(steps.check.outputs.tag_name, 'rc') }}
          body: |
            ## 版本信息
            - **版本号**: ${{ steps.check.outputs.full_version }}
            - **构建日期**: ${{ steps.check.outputs.build_date }}
            - **Commit**: ${{ github.sha }}

            ## 下载
            - Linux x64: `picacg-${{ steps.check.outputs.full_version }}-linux-x64.tar.gz`
            - Windows x64: `picacg-${{ steps.check.outputs.full_version }}-windows-x64.zip`
            - macOS ARM64: `picacg-${{ steps.check.outputs.full_version }}-macos-arm64.dmg`

            ## 说明
            - 已内置 Sarasa（更纱黑体）字体，无需额外安装
            - Linux/Windows: 解压后保持目录结构即可运行
            - macOS: 双击 DMG → 拖拽 PicACG.app 到 Applications 文件夹

  # ============ 手动 Tag Release（保留兼容手动打 tag） ============
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 生成版本信息
      - name: Generate version info
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_META="${SHORT_SHA}"
          echo "build_meta=$BUILD_META" >> $GITHUB_OUTPUT

          FULL_VERSION="${TAG_VERSION}+${BUILD_META}"
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" \) | head -20

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.sha256" \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.version.outputs.full_version }}"
          tag_name: ${{ steps.version.outputs.tag_version }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          body: |
            ## 版本信息
            - **版本号**: ${{ steps.version.outputs.full_version }}
            - **构建日期**: ${{ steps.version.outputs.build_date }}
            - **Commit**: ${{ github.sha }}

            ## 下载
            - Linux x64: `picacg-${{ steps.version.outputs.full_version }}-linux-x64.tar.gz`
            - Windows x64: `picacg-${{ steps.version.outputs.full_version }}-windows-x64.zip`
            - macOS ARM64: `picacg-${{ steps.version.outputs.full_version }}-macos-arm64.dmg`

            ## 说明
            - 已内置 Sarasa（更纱黑体）字体，无需额外安装
            - Linux/Windows: 解压后保持目录结构即可运行
            - macOS: 双击 DMG → 拖拽 PicACG.app 到 Applications 文件夹

  # ============ Dev 构建通知 ============
  dev-build-summary:
    name: Dev Build Summary
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Generate summary
        run: |
          echo "## Dev Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
